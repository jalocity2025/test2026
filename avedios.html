    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --text-color: #333;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        header {
            text-align: center;
            padding: 20px 10px;
            background: #2c3e50;
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 1.5rem; margin: 0 0 10px 0; }
        header p { font-size: 0.9rem; margin: 5px 0; }

        .container { max-width: 100%; margin: 0 auto; }

        .chapter-title {
            padding: 8px 15px;
            margin: 20px 0 10px;
            border-radius: 6px;
            font-weight: bold;
            background: #fff;
            display: inline-block;
            border-right: 5px solid var(--primary-color);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            width: 100%;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }

        .card:active {
            opacity: 0.85;
        }

        .icon {
            background: rgba(255, 255, 255, 0.25);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            flex-shrink: 0;
        }

        .icon svg { fill: white; width: 22px; height: 22px; }

        /* تصميم نافذة عرض الفيديو المنبثقة (Modal) */
        #videoModal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            position: relative;
            width: 95%;
            max-width: 800px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* نسبة العرض للإرتفاع 16:9 */
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* زر الإغلاق الواضح في أعلى الشاشة */
        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        /* تلوين الفصول */
        .ch1 { background-color: #3498db; }
        .ch2 { background-color: #e67e22; }
        .ch3 { background-color: #e67e22; }
        .ch4 { background-color: #1abc9c; }
        .ch5 { background-color: #9b59b6; }
        .ch6 { background-color: #34495e; }
        .rev { background-color: #27ae60; }

        footer { text-align: center; margin-top: 40px; padding-bottom: 20px; color: #777; font-size: 0.85rem; }
    </style>
</head>

<!-- النافذة المنبثقة للفيديو -->
<div id="videoModal">
    <button class="close-btn" onclick="closeVideo()">&times;</button>
    <div class="modal-content">
        <div class="video-wrapper" id="videoSlot"></div>
    </div>
</div>

<script>
    function openVideo(videoId) {
        var modal = document.getElementById('videoModal');
        var slot = document.getElementById('videoSlot');
        
        // تشغيل الفيديو بشكل نظيف داخل النافذة المنبثقة وبدون مقترحات يوتيوب
        slot.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
        modal.style.display = 'flex';
    }

    function closeVideo() {
        var modal = document.getElementById('videoModal');
        var slot = document.getElementById('videoSlot');
        
        // إغلاق النافذة وإيقاف الفيديو تماماً لحفظ إنترنت الطلاب
        modal.style.display = 'none';
        slot.innerHTML = '';
    }
</script>
