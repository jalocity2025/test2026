    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --text-color: #333;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        header {
            text-align: center;
            padding: 20px 10px;
            background: #2c3e50;
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 1.5rem; margin: 0 0 10px 0; }
        header p { font-size: 0.9rem; margin: 5px 0; }

        .container { max-width: 100%; margin: 0 auto; }

        .chapter-title {
            padding: 8px 15px;
            margin: 20px 0 10px;
            border-radius: 6px;
            font-weight: bold;
            background: #fff;
            display: inline-block;
            border-right: 5px solid var(--primary-color);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .lesson-box {
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
        }

        .card {
            width: 100%;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            align-items: center;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .card:active {
            opacity: 0.85;
        }

        .icon {
            background: rgba(255, 255, 255, 0.25);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .icon svg { fill: white; width: 20px; height: 20px; }

        /* حاوية الفيديو المخفية حتى يتم الضغط على الزر */
        .video-container {
            display: none;
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* نسبة العرض للإرتفاع 16:9 */
            height: 0;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* تلوين الفصول */
        .ch1 { background-color: #3498db; }
        .ch2 { background-color: #e67e22; }
        .ch4 { background-color: #1abc9c; }
        .ch5 { background-color: #9b59b6; }
        .ch6 { background-color: #34495e; }
        .rev { background-color: #27ae60; }

        footer { text-align: center; margin-top: 40px; padding-bottom: 20px; color: #777; font-size: 0.85rem; }
    </style>
</head>

<script>
    function toggleVideo(containerId, videoId) {
        var container = document.getElementById(containerId);
        
        // إذا كان الفيديو معروضاً بالفعل، يتم إغلاقه وإيقافه
        if (container.style.display === 'block') {
            container.style.display = 'none';
            container.innerHTML = '';
        } else {
            // إغلاق أي فيديوهات أخرى مفتوحة لتخفيف الحمل على الهاتف
            var allContainers = document.querySelectorAll('.video-container');
            allContainers.forEach(function(box) {
                box.style.display = 'none';
                box.innerHTML = '';
            });

            // عرض المشغل النظيف الخاص بالفيديو المحدد فقط بدون تعليقات أو مقترحات
            container.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
            container.style.display = 'block';
        }
    }
</script>
