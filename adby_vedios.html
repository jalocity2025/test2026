<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثانوية صلاح الدين - دروس الفيديو</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --text-color: #333;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: #2c3e50;
            color: white;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 1.8rem; margin: 0 0 10px 0; }
        header p { font-size: 1.1rem; margin: 0; opacity: 0.9; }

        .container { max-width: 1000px; margin: 0 auto; }

        .chapter-title {
            padding: 10px 15px;
            margin: 30px 0 15px;
            border-radius: 8px;
            font-weight: bold;
            background: #fff;
            display: inline-block;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            font-size: 1.1rem;
            border-right: 5px solid var(--primary-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .card {
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            cursor: pointer;
            width: 100%;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        .card:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .card:active {
            transform: scale(0.98);
        }

        .icon {
            background: rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            flex-shrink: 0;
        }

        .icon svg { fill: white; width: 20px; height: 20px; }

        /* ألوان الخلفيات لكل فصل */
        .ch1 { background-color: #3498db; } /* أزرق */
        .ch2 { background-color: #e67e22; } /* برتقالي */
        .ch3 { background-color: #9b59b6; } /* بنفسجي */
        .ch4 { background-color: #1abc9c; } /* تركوازي */
        .ch5 { background-color: #34495e; } /* رمادي غامق */
        .ch6 { background-color: #d35400; } /* طوبي */
        .rev { background-color: #27ae60; } /* أخضر للمراجعة */

        /* تصميم النافذة المنبثقة لعرض الفيديو (Modal) */
        #videoModal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            position: relative;
            width: 95%;
            max-width: 850px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* نسبة العرض للإرتفاع 16:9 */
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* زر الإغلاق الواضح في أعلى الشاشة */
        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        footer { text-align: center; margin-top: 50px; color: #777; font-size: 0.9rem; }
    </style>
</head>

<!-- النافذة المنبثقة للفيديو وزر الإغلاق -->
<div id="videoModal">
    <button class="close-btn" onclick="closeVideo()">&times;</button>
    <div class="modal-content">
        <div class="video-wrapper" id="videoSlot"></div>
    </div>
</div>

<script>
    function openVideo(videoId) {
        var modal = document.getElementById('videoModal');
        var slot = document.getElementById('videoSlot');
        
        // إدراج مشغل يوتيوب النظيف بدون مقترحات أو تعليقات وبشكل مكبر
        slot.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
        modal.style.display = 'flex';
    }

    function closeVideo() {
        var modal = document.getElementById('videoModal');
        var slot = document.getElementById('videoSlot');
        
        // إغلاق النافذة وإيقاف تشغيل الفيديو فوراً لتوفير الإنترنت
        modal.style.display = 'none';
        slot.innerHTML = '';
    }
</script>
