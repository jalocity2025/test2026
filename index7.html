<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثانوية صلاح الدين جالو</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="container">
        <div class="header-section">
            <img src="flag.gif" alt="." class="school-logo">
            <div class="titles-wrapper">
                <h1>ثانوية صلاح الدين الايوبي جالو</h1>
                <h3> امتحان تطبيقات لاعمال السنة للفترة الثانية......الزمن 45 دقيقة</h3>				
               <h5>ملاحظة هامة :  اكتب الاسم  متبوعا برقم الجلوس الخاص بك</h5>
        <form id="quiz-form">
            <label for="name">الاسم:</label>
            <input type="text" id="name" name="name" required>
            
            <div id="questions"></div>
            
            <button type="button" id="submit-btn">إرسال</button>
            <button type="button" id="correct-btn" style="display: none; background-color: #007bff; margin-top: 10px;">تصحيح الإجابات</button>
        </form>
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script src="script7.js"></script>
</body>
</html>
